services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - shared_audio:/shared

  transcriber:
    build: ../services/transcriber
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WHISPER_MODEL=openai/whisper-tiny
    volumes:
      - shared_audio:/shared

  rag:
    build:
      context: ..
      dockerfile: services/rag/Dockerfile
    depends_on:
      redis:
        condition: service_started
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=transcriptions
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=SpeakLeash/bielik-11b-v2.3-instruct:Q4_K_M
      - RELEVANCE_THRESHOLD=0.5

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama:
    build: ../services/ollama/
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:latest

volumes:
  shared_audio:
  chroma_data:


